[package]
name = "rust-meth-lib"
version = "0.2.4"
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
description = "Core library for rust-meth: discover methods on Rust types via rust-analyzer."
documentation = "https://docs.rs/rust-meth-lib"
readme = "README.md"
categories = ["development-tools"]

[lib]
name = "rust_meth_lib"
path = "src/lib.rs"
doctest = false

[dependencies]
serde = {version = "1.0.229", default-features = false, features = [
	"serde_derive",
]}
serde_json = {workspace = true}
thiserror = {version = "2.0.20", default-features = false}

[dev-dependencies]
criterion = {version = "0.8.2", default-features = false}

[[example]]
name = "basic_query"

[[example]]
name = "method_info"

[[example]]
name = "third_party_crate"

[[example]]
name = "fuzzy_filter"

[[example]]
name = "go_to_definition"

[[example]]
name = "custom_error"

[[example]]
name = "batch_query"


[[bench]]
name = "benchmarks"
harness = false

[lints]
workspace = true
