[package]
name = "rust-meth-lib"
version = "0.1.1"
edition = "2024"
authors = ["T. Sawyer <saylesss87@proton.me>"]
description = "Core library for rust-meth: discover methods on Rust types via rust-analyzer."
license = "Apache-2.0"
homepage = "https://github.com/saylesss88/rust-meth"
repository = "https://github.com/saylesss88/rust-meth"
documentation = "https://docs.rs/rust-meth-lib"
readme = "README.md"
keywords = ["rust-analyzer", "lsp", "methods", "introspection"]
categories = ["development-tools"]

[lib]
name = "rust_meth_lib"
path = "src/lib.rs"

[dependencies]
anyhow = {version = "1.0.102", default-features = false}
fuzzy-matcher = "0.3.7"
indicatif = {version = "0.18.4", default-features = false}
owo-colors = "4.3.0"
serde = {version = "1.0.228", default-features = false, features = [
	"serde_derive",
]}
serde_json = "1.0.149"
dialoguer = {version = "0.12", features = [
	"fuzzy-select",
], default-features = false}
thiserror = "2.0.18"

[dev-dependencies]
criterion = {version = "0.8.2", default-features = false}

[[bench]]
name = "benchmarks"
harness = false

[lints.rust]
unsafe_code = "forbid"
future_incompatible = {level = "warn", priority = -1}
nonstandard_style = {level = "warn", priority = -1}
rust_2018_idioms = {level = "warn", priority = -1}

[lints.rustdoc]
all = "warn"

[lints.clippy]
all = {level = "warn", priority = -1}
pedantic = {level = "warn", priority = -1}
todo = "warn"
dbg_macro = "warn"
unwrap_used = "warn"
