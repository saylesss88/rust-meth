[package]
name = "rust-meth"
version = "0.1.3"
edition = "2024"
description = "Discover methods available on any Rust type with fuzzy filtering, inline documentation, interactive selection, and go-to-definition into standard library source code."
license = "MIT OR Apache-2.0"
homepage = "https://github.com/saylesss88/rust-meth"
repository = "https://github.com/saylesss88/rust-meth"
documentation = "https://docs.rs/rust-meth"
readme = "README.md"
keywords = ["rust-analyzer", "lsp", "methods", "cli", "introspection"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github", "*.gif", "*.png"]

[[bin]]
name = "rust-meth"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
dialoguer = {version = "0.12", features = [
	"fuzzy-select",
], default-features = false}
fuzzy-matcher = "0.3.7"
serde_json = "1.0.149"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[lints.rust]
unsafe_code = "warn"
deprecated = "warn"
unused_lifetimes = "warn"
elided_lifetimes_in_paths = "warn"
future_incompatible = {level = "warn", priority = -1}
nonstandard_style = {level = "warn", priority = -1}
rust_2018_idioms = {level = "warn", priority = -1}
rust_2021_prelude_collisions = "warn"
semicolon_in_expressions_from_macros = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"

[lints.rustdoc]
all = "warn"
missing_crate_level_docs = "warn"

[lints.clippy]
all = {level = "warn", priority = -1}
correctness = {level = "warn", priority = -1}
suspicious = {level = "warn", priority = -1}
style = {level = "warn", priority = -1}
complexity = {level = "warn", priority = -1}
perf = {level = "warn", priority = -1}
todo = "warn"
dbg_macro = "warn"
unwrap_used = "warn"
