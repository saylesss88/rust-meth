[package]
name = "rust-meth"
version = "0.1.0"
edition = "2024"
description = "Print all methods available on any Rust type, powered by rust-analyzer"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/saylesss88/rust-meth"
documentation = "https://docs.rs/rust-meth"
readme = "README.md"
keywords = ["rust", "cli", "methods", "lsp", "rust-analyzer"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.102"
serde_json = "1.0.149"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
debug = false
