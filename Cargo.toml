[package]
name = "rust-meth"
version = "0.1.6"
edition = "2024"
description = "Discover methods available on any Rust type with fuzzy filtering, inline documentation, interactive selection, and go-to-definition into standard library source code."
license = "MIT OR Apache-2.0"
homepage = "https://github.com/saylesss88/rust-meth"
repository = "https://github.com/saylesss88/rust-meth"
documentation = "https://docs.rs/rust-meth"
readme = "README.md"
keywords = ["rust-analyzer", "lsp", "methods", "cli", "introspection"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github", "*.gif", "*.png", "tests/", "benches/"]
resolver = "3"

[[bin]]
name = "rust-meth"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
dialoguer = {version = "0.12", features = [
	"fuzzy-select",
], default-features = false}
fuzzy-matcher = "0.3.7"
indicatif = "0.18.4"
serde_json = "1.0.149"

[profile.dev]
opt-level = 1
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[lints.rust]
unsafe_code = "forbid"
future_incompatible = {level = "warn", priority = -1}
nonstandard_style = {level = "warn", priority = -1}
rust_2018_idioms = {level = "warn", priority = -1}

[lints.rustdoc]
all = "warn"

[lints.clippy]
all = {level = "warn", priority = -1}
pedantic = {level = "warn", priority = -1}
todo = "warn"
dbg_macro = "warn"
unwrap_used = "warn"
